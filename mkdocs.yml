site_name: nave-xai
site_description: NAVE explanations of vision encoders
repo_url: https://github.com/Ahcene-B/NAVE
theme:
  name: material
  features: [navigation.sections, content.code.copy]
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How NAVE works: concepts.md
  - Your own models: custom-models.md
  - Fitting on a dataset: datasets.md
  - Time series: series.md
  - Text: text.md
  - Inspecting models: inspecting.md
  - Memory and large images: memory.md
  - API reference: api.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            heading_level: 3
